        <div class="liquid-glass absolute z-10 bottom-44">
          <div
            class="flex gap-8 *:hover:text-destaque/80 *:transition-all *:duration-300 *:cursor-pointer px-4 py-1"
            data-control="zoom">
            <span data-zoom="0.5">0,5x</span>
            <span class="zoom-ativo" data-zoom="1">1x</span>
            <span data-zoom="2">2x</span>
            <span data-zoom="5">5x</span>
          </div>
        </div>

        <div class="absolute z-10 bottom-0 h-40 w-full bg-black/40">
          <div class="absolute z-10 bottom-15 h-20 w-full">
            <div
              id="camera-modes"
              class="text-xs text-white uppercase font-light tracking-widest px-2 py-2 flex gap-12 *:shrink-0 *:hover:text-destaque/80 *:transition-all *:duration-300 *:cursor-pointer overflow-x-auto no-scrollbar snap-x snap-mandatory">
              <span aria-hidden="true" class="w-1/2 pointer-events-none"></span>
              <p class="snap-center" data-mode="cinematic">Cinematic</p>
              <p class="snap-center" data-mode="video">Video</p>
              <p class="snap-center text-destaque" data-mode="foto" data-active>
                Foto
              </p>
              <p class="snap-center" data-mode="portrait">Portrait</p>
              <p class="snap-center" data-mode="quadrado">Quadrado</p>
              <span aria-hidden="true" class="w-1/2 pointer-events-none"></span>
            </div>

            <div class="flex justify-between items-center px-8 py-4">
              <a href="./galeria.html" class="hover:cursor-pointer">
                <div
                  id="preview-container"
                  class="w-12 h-10 overflow-hidden rounded-lg">
                  <img
                    id="preview-image"
                    src="./src/assets/icons/photo.svg"
                    alt=""
                    srcset=""
                    class="block w-full h-full object-cover" />
                </div>
              </a>

              <div
                class="btn-shutter aspect-square w-12 h-12 flex items-center justify-center p-0 overflow-hidden hover:cursor-pointer"
                id="btn-foto">
                <button
                  id="shutter-btn"
                  aria-label="Tirar foto"
                  class="hover:cursor-pointer">
                  <img
                    id="shutter-icon"
                    src="./src/assets/icons/Ellipse-cam.svg"
                    alt=""
                    srcset=""
                    class="block w-full h-full object-cover" />
                </button>
              </div>

              <div class="hover:cursor-pointer" id="btn-alternar">
                <img
                  src="./src/assets/icons/rotate.camera.svg"
                  alt=""
                  srcset="" />
              </div>
            </div>
          </div>
        </div>

        <!-- Imagem da câmera -->
        <video
          id="webcam"
          autoplay=""
          playsinline=""
          class="-z-10 block h-screen w-screen object-cover"
          muted=""
          style="
            filter: brightness(100%) contrast(100%) saturate(100%);
          "></video>
        <canvas id="photo-canvas" style="display: none"> </canvas>
      </div>
    </main>
    <!-- Script -->
    <script src="./src/js/funcoes.js"></script>
    <script src="./src/js/camera.js"></script>
  </body>
</html>
